<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Pendaftaran Seminar Teknologi Nasional 2026</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="wrapper">
        <div id="header-form">
            <h2>Formulir Pendaftaran Seminar</h2>
            <p>Silakan isi data diri Anda di bawah ini.</p>
        </div>

        <form action="" method="post" enctype="multipart/form-data">
            <fieldset>
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" size="30" placeholder="Masukkan nama Anda" />
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="text" id="email" name="email" size="30" placeholder="nama@email.com" />
                </div>

                <div class="form-group">
                    <label for="nim">Nomor Induk Mahasiswa (NIM)</label>
                    <input type="text" id="nim" name="nim" size="30" placeholder="Contoh: 21001" />
                </div>

                <div class="form-group">
                    <label for="prodi">Program Studi</label>
                    <select id="prodi" name="prodi">
                        <option value="">-- Pilih Program Studi --</option>
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                        <option>Manajemen</option>
                        <option>Akuntansi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Pilihan Jenis Tiket</label>
                    <div class="radio-group">
                        <input type="radio" id="reguler" name="tiket" value="Reguler" />
                        <label for="reguler" class="inline-label">Reguler</label>

                        <input type="radio" id="vip" name="tiket" value="VIP" />
                        <label for="vip" class="inline-label">VIP</label>

                        <input type="radio" id="online" name="tiket" value="Online" />
                        <label for="online" class="inline-label">Online</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Topik Seminar yang Diminati</label>
                    <div class="checkbox-group">
                        <p><input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" /> <label for="ai" class="inline-label">Artificial Intelligence</label></p>
                        <p><input type="checkbox" id="data" name="topik" value="Data Science" /> <label for="data" class="inline-label">Data Science</label></p>
                        <p><input type="checkbox" id="cyber" name="topik" value="Cyber Security" /> <label for="cyber" class="inline-label">Cyber Security</label></p>
                        <p><input type="checkbox" id="cloud" name="topik" value="Cloud Computing" /> <label for="cloud" class="inline-label">Cloud Computing</label></p>
                        <p><input type="checkbox" id="web" name="topik" value="Web Development" /> <label for="web" class="inline-label">Web Development</label></p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="jam">Sesi Waktu Seminar</label>
                    <select id="jam" name="jam">
                        <option>08.00 - 10.00 WIB</option>
                        <option>10.00 - 12.00 WIB</option>
                        <option>13.00 - 15.00 WIB</option>
                        <option>15.00 - 17.00 WIB</option>
                        <option>19.00 - 21.00 WIB</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <div class="radio-group">
                        <p><input type="radio" id="qris" name="pembayaran" value="QRIS" /> <label for="qris" class="inline-label">QRIS</label></p>
                        <p><input type="radio" id="transfer" name="pembayaran" value="Transfer Bank" /> <label for="transfer" class="inline-label">Transfer Bank</label></p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pertanyaan">Pertanyaan untuk Narasumber</label>
                    <textarea id="pertanyaan" name="pertanyaan" rows="5" cols="30" placeholder="Tuliskan pertanyaan jika ada..."></textarea>
                </div>

                <div class="form-group">
                    <label for="bukti">Unggah Bukti Pembayaran</label>
                    <input type="file" id="bukti" name="bukti" accept="image/gif, image/jpeg, image/png" />
                </div>

                <div class="form-actions">
                    <input type="submit" name="simpan" value="Kirim Pendaftaran" class="btn-submit" />
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
